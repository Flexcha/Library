version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: library_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: library_db
      MYSQL_USER: library_app
      MYSQL_PASSWORD: changeme
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_backend
    restart: always
    environment:
      PORT: 8080
      DATABASE_URL: mysql://library_app:changeme@mysql:3306/library_db
      JWT_SECRET: super-secret-jwt-key-for-development-only-change-in-prod-123456789
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      LOAN_DEFAULT_PERIOD_DAYS: 14
      LOAN_MAX_RENEWALS: 2
      FINE_DAILY_RATE: 5000
      FINE_MAX_UNPAID_BEFORE_BLOCK: 50000
      RESERVATION_PICKUP_WINDOW_DAYS: 3
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
