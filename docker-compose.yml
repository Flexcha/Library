version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: library_postgres
    restart: always
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library_app
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_app -d library_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_backend
    restart: always
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://library_app:changeme@postgres:5432/library_db
      JWT_SECRET: super-secret-jwt-key-for-development-only-change-in-prod-123456789
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      LOAN_DEFAULT_PERIOD_DAYS: 14
      LOAN_MAX_RENEWALS: 2
      FINE_DAILY_RATE: 5000
      FINE_MAX_UNPAID_BEFORE_BLOCK: 50000
      RESERVATION_PICKUP_WINDOW_DAYS: 3
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

